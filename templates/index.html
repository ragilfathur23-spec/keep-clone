<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <title>Keep Clone</title>
    </head>
    <body>
        
        <h1>Keep Clone</h1>
        
        <h2>Daftar Catatan</h2>
        {% if notes %}
            <ul>
                {% for note in notes %}
                    <li><strong>{{ note["title"] }}</strong>: {{ note["content"] }}</li>
                {% endfor %}
            </ul>
        {% else %}
            <p>Belum ada catatan</p>
        {% endif %}
    </body>
</html>
