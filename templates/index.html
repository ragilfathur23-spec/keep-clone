<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keep Clone</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Keep Clone</h1>

    <h2>Tambah Catatan</h2>
    <div class="note">
        <form action="{{ url_for('add_note')}}" method="POST">
            <input type="text" name="title" placeholder="Judul">
            <textarea name="content" placeholder="Isi catatan" rows="3" required></textarea>
            <button type="submit">Simpan</button>
        </form>
    </div>

    <h2>Daftar Catatan</h2>
    {% if notes %}
    {% for note in notes %}
    <div class="note">
        {% if note["is_pinned"] %} {% endif %}
        {% if note["title"] %}<strong>{{ note["title"] }}</strong><br> {% endif %}
        <p>{{ note["content"] }}</p>

        <div class="actions">
            <a href="{{ url_for('edit_note', note_id=note['id']) }}">Edit</a>

            <form action="{{ url_for('pin_note', note_id=note['id']) }}" method="POST" style="display:inline;">
                <button type="submit">{{ "Lepas pin" if note["is_pinned"] else "Pin"}}</button>
            </form>

            <form action="{{ url_for('delete_note', note_id=note['id']) }}" method="POST" style="display:inline;">
                <button type="submit">Hapus</button>
            </form>
        </div>
    </div>
    {% endfor %}
    {% else %}
    <p>Belum ada catatan</p>
    {% endif %}
</body>

</html>
