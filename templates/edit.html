<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Edit Catatan</title>
</head>
<body>
    <h1>Edit Catatan</h1>
    <form method="POST">
        <input type="text" name="title" value="{{ note['title'] }}" placeholder="Judul">
        <br>
        <textarea name="content" rows="3" required>{{ note["content"] }}</textarea>
        <br>
        <button type="submit">Simpan Perubahan</button>
        <a href="{{ url_for('home') }}">Batal</a>
    </form>
</body>
</html>
